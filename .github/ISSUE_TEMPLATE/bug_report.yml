name: Bug report
description: Report a reproducible defect in the library, demos or documentation.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets or private data.
        For security vulnerabilities, use SECURITY.md instead of this form.
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or commit SHA.
      placeholder: "2.6.0"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Full build
        - Select-only build
        - File-only build
        - Documentation or demo site
        - Repository tooling
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal HTML/JS and exact steps.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the console error and a screenshot if useful.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: "Chrome 140, Windows 11"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private data from this report.
          required: true
