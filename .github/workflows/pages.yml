name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialise Pages deployments without cancelling one that is already running: an
# interrupted upload is exactly what leaves the next run without its artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp index.html advanced.html api.html ajax.html playground.html shopify.html advanced.css advanced.js api.css api.js ajax.css ajax.js playground.css playground.js demo.css demo.js nav.css nav.js docs.css lab.js LICENSE _site/
          cp -r demo-data _site/demo-data
          cp robots.txt sitemap.xml _site/
          cp zidan-form.js zidan-form.mjs plugin-core.css plugin-theme.css _site/
          cp -r docs/. _site/docs/

      - name: Build the documentation pages
        run: node scripts/docs.mjs _site/docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # deploy-pages resolves the artifact by name within its own run. Doing the upload
  # and the deploy in one job intermittently listed 0 artifacts, because the lookup
  # ran a fraction of a second after the upload was finalised. A separate job starts
  # only once the build job — upload included — has completed, which is the shape
  # GitHub documents for Pages deployments.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
