name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp index.html advanced.html ajax.html playground.html shopify.html advanced.css advanced.js ajax.css ajax.js playground.css playground.js demo.css demo.js nav.css nav.js docs.css lab.js LICENSE _site/
          cp -r demo-data _site/demo-data
          cp robots.txt sitemap.xml _site/
          cp zidan-form.js zidan-form.mjs plugin-core.css plugin-theme.css _site/
          cp -r docs/. _site/docs/

      - name: Build the documentation pages
        run: node scripts/docs.mjs _site/docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
